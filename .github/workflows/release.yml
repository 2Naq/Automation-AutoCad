name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Phien ban tag (vi du: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Cung cap bo go dotnet CLI co san

      - name: Build Solution (Release)
        run: |
          dotnet build src/CadElectricalToolkit/CadElectricalToolkit.csproj -c Release /p:AutoCadPath=C:\dummy

      - name: Package Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -Path "bundle/CadElectricalToolkit.bundle" -DestinationPath "dist/CadElectricalToolkit-bundle.zip" -Force
          Copy-Item "src/CadElectricalToolkit/bin/Release/net48/CadElectricalToolkit.dll" -Destination "dist/CadElectricalToolkit.dll" -Force

      - name: Determine Tag Name
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: CadElectricalToolkit ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/CadElectricalToolkit-bundle.zip
            dist/CadElectricalToolkit.dll
